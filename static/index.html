<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Brain</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg:        #09090b;
  --bg2:       #0f1013;
  --bg3:       #16181d;
  --bg4:       #1c1f27;
  --border:    #1e2230;
  --border2:   #252d40;
  --text:      #c8d0e0;
  --text2:     #6b7590;
  --text3:     #3d4560;
  --accent:    #3d7fff;
  --accent-lo: rgba(61,127,255,0.12);
  --green:     #22d48a;
  --green-lo:  rgba(34,212,138,0.1);
  --red:       #e05555;
  --red-lo:    rgba(224,85,85,0.1);
  --amber:     #f0a030;
  --amber-lo:  rgba(240,160,48,0.1);
  --purple:    #a07aff;
  --purple-lo: rgba(160,122,255,0.1);
  --spark:          #4a9de0;
  --confirmed:      #22d48a;
  --escalation:     #f0a030;
  --structural:     #b06aff;
  --regime:         #e05555;
  --font: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  --r: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; height: 100vh; overflow: hidden; }
#root { height: 100vh; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Layout ── */
.shell { display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 800; }
.nav { display: flex; gap: 1px; margin-left: 20px; }
.nav-btn { padding: 5px 12px; border-radius: var(--r); font-size: 12px; color: var(--text2); cursor: pointer; border: none; background: none; font-family: var(--font); transition: all 0.12s; }
.nav-btn:hover { color: var(--text); }
.nav-btn.active { color: var(--text); background: var(--bg4); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.pill { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-family: var(--mono); border: 1px solid var(--border); color: var(--text2); display: flex; align-items: center; gap: 5px; cursor: pointer; transition: border-color 0.15s; }
.pill:hover { border-color: var(--border2); }
.dot { width: 6px; height: 6px; border-radius: 50%; }

/* ── Buttons ── */
.btn { padding: 6px 13px; border-radius: var(--r); font-size: 12px; cursor: pointer; border: none; font-family: var(--font); transition: all 0.12s; }
.btn-primary { background: var(--accent); color: #fff; font-weight: 500; }
.btn-primary:hover { background: #5590ff; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border2); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-danger { background: transparent; color: var(--red); border: 1px solid transparent; }
.btn-danger:hover { border-color: var(--red); }

/* ── Main ── */
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 288px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
.sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.sidebar-scroll { flex: 1; overflow-y: auto; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Badges ── */
.wave-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; font-family: var(--mono); }
.wave-spark       { background: rgba(74,157,224,0.12); color: var(--spark);       border: 1px solid rgba(74,157,224,0.25); }
.wave-confirmed   { background: rgba(34,212,138,0.12); color: var(--confirmed);   border: 1px solid rgba(34,212,138,0.25); }
.wave-escalation  { background: rgba(240,160,48,0.12); color: var(--escalation);  border: 1px solid rgba(240,160,48,0.25); }
.wave-structural  { background: rgba(176,106,255,0.12); color: var(--structural); border: 1px solid rgba(176,106,255,0.25); }
.wave-regime      { background: rgba(224,85,85,0.12);  color: var(--regime);      border: 1px solid rgba(224,85,85,0.25); }

.dir-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-family: var(--mono); }
.dir-bullish { color: var(--green); background: var(--green-lo); }
.dir-bearish { color: var(--red);   background: var(--red-lo); }
.dir-neutral { color: var(--text2); background: var(--bg4); }

.att-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-family: var(--mono); }
.att-watch    { color: var(--text2); background: var(--bg4); }
.att-focus    { color: var(--amber); background: var(--amber-lo); }
.att-actioned { color: var(--green); background: var(--green-lo); }

/* ── Catalyst list ── */
.cat-item { padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; position: relative; }
.cat-item:hover { background: var(--bg3); }
.cat-item.sel { background: var(--bg3); }
.cat-item.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.cat-name { font-size: 12px; color: var(--text); line-height: 1.4; margin-bottom: 7px; font-weight: 450; }
.cat-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.conf-track { height: 2px; background: var(--border); border-radius: 1px; margin-top: 7px; }
.conf-fill { height: 2px; border-radius: 1px; transition: width 0.3s; }

/* ── Detail panel ── */
.detail-title { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 14px; }
.detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 6px; }
.kpi-value { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.kpi-sub { font-size: 10px; color: var(--text2); margin-top: 4px; }

.section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 8px; font-weight: 600; }
.section-block { margin-bottom: 20px; }

.sig-row { padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 6px; border-left: 2px solid var(--border2); }
.sig-row:last-child { margin-bottom: 0; }
.sig-source { font-size: 10px; color: var(--accent); font-family: var(--mono); text-transform: uppercase; margin-bottom: 4px; }
.sig-text { font-size: 12px; color: var(--text2); line-height: 1.5; }

.att-btn-row { display: flex; gap: 6px; }
.att-btn { padding: 6px 14px; border-radius: var(--r); font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: var(--font); transition: all 0.15s; }
.att-btn:hover { border-color: var(--border2); color: var(--text); }
.att-btn.active-watch    { border-color: var(--text2);  color: var(--text); }
.att-btn.active-focus    { border-color: var(--amber);  color: var(--amber);  background: var(--amber-lo); }
.att-btn.active-actioned { border-color: var(--green);  color: var(--green);  background: var(--green-lo); }

.conf-meter { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.conf-fill-lg { height: 6px; border-radius: 3px; transition: width 0.4s; }
.tag { display: inline-flex; padding: 2px 7px; background: var(--bg4); border: 1px solid var(--border); border-radius: 3px; font-size: 10px; color: var(--text3); margin: 2px; font-family: var(--mono); }

/* ── Sebastian ── */
.seb-shell { display: flex; flex-direction: column; height: calc(100vh - 44px); background: var(--bg2); }
.seb-header { padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.seb-engine-label { font-size: 10px; font-family: var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
.seb-title { font-size: 15px; font-weight: 600; }
.seb-sub { font-size: 11px; color: var(--text2); margin-top: 3px; }
.seb-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.seb-block { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.seb-block-label { font-size: 10px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
.seb-block-text { font-size: 13px; color: var(--text2); line-height: 1.7; white-space: pre-wrap; }
.seb-user-block { background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--r); padding: 10px 14px; }
.seb-user-label { font-size: 10px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; margin-bottom: 4px; }
.seb-user-text { font-size: 13px; color: var(--text); }
.seb-input-area { padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end; }
.seb-textarea { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; color: var(--text); font-family: var(--font); font-size: 13px; outline: none; resize: none; min-height: 40px; max-height: 120px; }
.seb-textarea:focus { border-color: var(--accent); }
.seb-shortcuts { display: flex; gap: 6px; padding: 0 20px 10px; flex-wrap: wrap; flex-shrink: 0; }
.shortcut-btn { padding: 4px 10px; background: var(--bg4); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; color: var(--text2); cursor: pointer; font-family: var(--font); transition: all 0.12s; }
.shortcut-btn:hover { border-color: var(--border2); color: var(--text); }
.loading-pulse { opacity: 0.5; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.9; } }

/* ── Assets ── */
.assets-filter { display: flex; gap: 6px; margin-bottom: 16px; }
.assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.asset-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
.asset-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.asset-card.focus-on { border-color: var(--amber); }
.asset-card.watch-on { border-color: var(--border2); }
.asset-card.actioned-on { border-color: var(--green); }
.asset-ticker { font-size: 15px; font-weight: 700; margin-bottom: 2px; font-family: var(--mono); }
.asset-sector { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.asset-conf-num { font-size: 24px; font-weight: 700; font-family: var(--mono); }
.no-signal { font-size: 11px; color: var(--text3); margin-top: 8px; }

/* ── Missions ── */
.mission-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.mtype-btn { padding: 12px 8px; border: 1px solid var(--border); border-radius: var(--r); background: transparent; color: var(--text2); cursor: pointer; font-family: var(--font); font-size: 12px; text-align: center; transition: all 0.12s; }
.mtype-btn:hover { border-color: var(--border2); }
.mtype-btn.sel { border-color: var(--accent); color: var(--text); background: var(--accent-lo); }
.mtype-icon { font-size: 18px; margin-bottom: 5px; }
.mission-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.mission-item:last-child { border-bottom: none; }
.mission-target { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.mission-desc { font-size: 11px; color: var(--text2); }
.prio-badge { padding: 2px 7px; border-radius: 3px; font-size: 10px; font-family: var(--mono); }
.prio-normal   { color: var(--accent); background: var(--accent-lo); }
.prio-high     { color: var(--amber);  background: var(--amber-lo); }
.prio-critical { color: var(--red);    background: var(--red-lo); }

/* ── Auth ── */
.auth-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
.auth-box { width: 380px; }
.auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
.auth-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; }
.auth-heading { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.auth-sub { font-size: 12px; color: var(--text2); margin-bottom: 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
.field input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); padding: 9px 12px; color: var(--text); font-family: var(--font); font-size: 13px; outline: none; transition: border-color 0.15s; }
.field input:focus { border-color: var(--accent); }
.auth-link { font-size: 12px; color: var(--text2); text-align: center; margin-top: 16px; }
.auth-link span { color: var(--accent); cursor: pointer; }
.err-box { background: var(--red-lo); border: 1px solid rgba(224,85,85,0.25); border-radius: var(--r); padding: 8px 12px; font-size: 11px; color: var(--red); margin-bottom: 14px; }

/* ── Cards ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); }
.card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text2); }
.card-body { padding: 16px; }

/* ── Chain modal ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(2px); }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--r); padding: 24px; width: 440px; max-width: 95vw; }
.modal-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.chain-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 11px; border-radius: var(--r); margin-bottom: 3px; background: var(--bg3); font-size: 12px; }
.chain-ok   { color: var(--green); font-size: 11px; font-family: var(--mono); }
.chain-warn { color: var(--amber); font-size: 11px; font-family: var(--mono); }
.chain-err  { color: var(--red);   font-size: 11px; font-family: var(--mono); }

/* ── Empty states ── */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty h3 { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
.empty p  { font-size: 12px; line-height: 1.6; }

/* ── Tooltips ── */
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--r); padding: 5px 9px; font-size: 11px; color: var(--text); z-index: 50; pointer-events: none; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

/* ── API ── */
const BASE = '';
let _token = localStorage.getItem('mb_token') || '';

async function api(path, opts = {}) {
  const res = await fetch(BASE + path, {
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.detail || `${res.status} ${res.statusText}`);
  }
  return res.json();
}

/* ── Helpers ── */
function confColor(c) {
  if (c >= 75) return 'var(--green)';
  if (c >= 50) return 'var(--amber)';
  if (c >= 25) return 'var(--accent)';
  return 'var(--red)';
}

function timeAgo(ts) {
  const d = Date.now() / 1000 - ts;
  if (d < 60)    return `${Math.round(d)}s ago`;
  if (d < 3600)  return `${Math.round(d/60)}m ago`;
  if (d < 86400) return `${Math.round(d/3600)}h ago`;
  return `${Math.round(d/86400)}d ago`;
}

function WaveBadge({ wave }) {
  return <span className={`wave-badge wave-${wave||'spark'}`}>{wave||'spark'}</span>;
}
function DirBadge({ dir }) {
  const arrow = dir==='bullish' ? '↑' : dir==='bearish' ? '↓' : '→';
  return <span className={`dir-badge dir-${dir||'neutral'}`}>{arrow} {dir||'neutral'}</span>;
}
function AttBadge({ att }) {
  const label = att==='actioned' ? '✓ Actioned' : att==='focus' ? '◉ Focus' : '◎ Watch';
  return <span className={`att-badge att-${att||'watch'}`}>{label}</span>;
}

/* ═══════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════ */
function AuthScreen({ onAuth }) {
  const [mode, setMode]     = useState('login');
  const [name, setName]     = useState('');
  const [email, setEmail]   = useState('');
  const [pw, setPw]         = useState('');
  const [err, setErr]       = useState('');
  const [busy, setBusy]     = useState(false);

  async function submit() {
    setErr(''); setBusy(true);
    try {
      const body = mode==='login' ? { email, password: pw } : { name, email, password: pw };
      const data = await api(mode==='login' ? '/api/auth/login' : '/api/auth/register', { method:'POST', body });
      _token = data.token;
      localStorage.setItem('mb_token', _token);
      onAuth(data.user);
    } catch(e) { setErr(e.message); }
    setBusy(false);
  }

  return (
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-logo">
          <div className="logo-mark">M</div>
          <span style={{ fontSize:15, fontWeight:700 }}>Market Brain</span>
        </div>
        <div className="auth-card">
          <div className="auth-heading">{mode==='login' ? 'Sign in' : 'Create account'}</div>
          <div className="auth-sub">Intelligence terminal · Phase 1</div>
          {err && <div className="err-box">{err}</div>}
          {mode==='register' && (
            <div className="field"><label>Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" /></div>
          )}
          <div className="field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@domain.com" /></div>
          <div className="field">
            <label>Password</label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="••••••••" />
          </div>
          <button className="btn btn-primary" style={{width:'100%',marginTop:6}} onClick={submit} disabled={busy}>
            {busy ? 'Loading...' : mode==='login' ? 'Sign in' : 'Create account'}
          </button>
          <div className="auth-link">
            {mode==='login' ? <>No account? <span onClick={()=>setMode('register')}>Register</span></> : <>Have an account? <span onClick={()=>setMode('login')}>Sign in</span></>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   CATALYST SIDEBAR
═══════════════════════════════════════════════ */
function CatalystSidebar({ cats, selected, onSelect, loading, onNew }) {
  const [filter, setFilter] = useState('all');
  const filtered = useMemo(() => {
    if (filter==='all')      return cats;
    if (filter==='focus')    return cats.filter(c=>c.attention==='focus');
    if (filter==='actioned') return cats.filter(c=>c.attention==='actioned');
    if (filter==='high')     return cats.filter(c=>c.confidence>=65);
    return cats;
  }, [cats, filter]);

  return (
    <div className="sidebar">
      <div className="sidebar-header">
        <div>
          <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.07em',color:'var(--text2)'}}>Catalysts</div>
          <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>{cats.length} active</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={onNew}>+ Mission</button>
      </div>
      <div style={{display:'flex',gap:4,padding:'8px 10px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        {['all','focus','actioned','high'].map(f=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{padding:'3px 8px',borderRadius:4,fontSize:10,fontFamily:'var(--mono)',border:'none',cursor:'pointer',
              background: filter===f ? 'var(--bg4)' : 'transparent',
              color: filter===f ? 'var(--text)' : 'var(--text3)'}}>
            {f}
          </button>
        ))}
      </div>
      <div className="sidebar-scroll">
        {loading && <div style={{padding:20,color:'var(--text3)',fontSize:12}}>Loading signals...</div>}
        {!loading && filtered.length===0 && (
          <div className="empty" style={{padding:32}}>
            <h3>No catalysts</h3>
            <p>Start a mission to begin tracking signals</p>
          </div>
        )}
        {filtered.map(cat => (
          <div key={cat.id} className={`cat-item${selected?.id===cat.id?' sel':''}`} onClick={()=>onSelect(cat)}>
            <div className="cat-name">{cat.title?.slice(0,90)}</div>
            <div className="cat-row">
              <WaveBadge wave={cat.wave} />
              <DirBadge dir={cat.direction} />
              {cat.attention==='focus'    && <span style={{fontSize:9,color:'var(--amber)',fontFamily:'var(--mono)',textTransform:'uppercase'}}>FOCUS</span>}
              {cat.attention==='actioned' && <span style={{fontSize:9,color:'var(--green)',fontFamily:'var(--mono)',textTransform:'uppercase'}}>ACTIONED</span>}
            </div>
            <div className="conf-track">
              <div className="conf-fill" style={{width:`${Math.max(2,cat.confidence)}%`,background:confColor(cat.confidence)}} />
            </div>
            <div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>
              {cat.confidence}% · {(cat.assets||[]).slice(0,3).join(' ')||cat.sectors?.slice(0,2).join(' ')||'global'}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════

      <p>Choose a catalyst from the sidebar to view full intelligence detail<br/>or start a mission to begin tracking an asset, sector, or theme</p>

    <div>

        <div className="detail-title">{cat.title}</div>
        <div className="detail-badges">
          <WaveBadge wave={cat.wave} />
          <DirBadge dir={cat.direction} />
          <AttBadge att={cat.attention} />
          {cat.verified && <span style={{fontSize:10,color:'var(--green)',border:'1px solid rgba(34,212,138,0.3)',padding:'2px 7px',borderRadius:3,fontFamily:'var(--mono)'}}>✓ VERIFIED</span>}
          {cat.mission_id && <span style={{fontSize:10,color:'var(--purple)',border:'1px solid rgba(160,122,255,0.3)',padding:'2px 7px',borderRadius:3,fontFamily:'var(--mono)'}}>◎ MISSION</span>}

      {/* KPIs */}
      <div className="kpi-grid">
        <div className="kpi">
          <div className="kpi-label">Confidence</div>
          <div className="kpi-value" style={{color:confColor(cat.confidence)}}>{cat.confidence}%</div>
          <div className="conf-meter" style={{marginTop:8}}>
            <div className="conf-fill-lg" style={{width:`${Math.max(2,cat.confidence)}%`,background:confColor(cat.confidence)}} />
          </div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Renewals</div>
          <div className="kpi-value" style={{color:'var(--text)'}}>{cat.renewal_count}</div>
          <div className="kpi-sub">signal updates</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Sources</div>
          <div className="kpi-value" style={{color:'var(--purple)'}}>{sources.length}</div>
          <div className="kpi-sub">{sources.slice(0,2).join(', ')}</div>

      </div>

      {/* Sebastian summary */}
      {cat.persona_summary && (
        <div className="section-block">
          <div className="section-label">Sebastian Interpretation</div>
          <div className="sig-row" style={{borderLeftColor:'var(--accent)'}}>
            <div className="sig-source">Sebastian · Intelligence Engine</div>
            <div className="sig-text">{cat.persona_summary}</div>
          </div>
        </div>
      )}

      {/* Assets / Sectors */}
      <div className="section-block">
        <div className="section-label">Scope</div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          {(cat.assets||[]).map(a=><span key={a} className="tag">{a}</span>)}
          {(cat.sectors||[]).map(s=><span key={s} className="tag" style={{color:'var(--text2)'}}>{s}</span>)}
          {(cat.tags||[]).map(t=><span key={t} className="tag" style={{color:'var(--text3)'}}>{t}</span>)}
          {!(cat.assets||[]).length && !(cat.sectors||[]).length && <span style={{fontSize:11,color:'var(--text3)'}}>Global / cross-sector</span>}
        </div>
      </div>

      {/* Timeline */}
      <div className="section-block">
        <div className="section-label">Timeline</div>
        <div style={{display:'flex',gap:20,fontSize:11,color:'var(--text2)',fontFamily:'var(--mono)'}}>
          <span>Detected {timeAgo(cat.detected_at)}</span>
          <span>Updated {timeAgo(cat.updated_at)}</span>
          <span>Expires {timeAgo(cat.expires_at)}</span>
          <span>Type: {cat.type}</span>
        </div>

      <div className="section-block">
        <div className="section-label">Signal Chain ({(cat.signals||[]).length} signals)</div>

            <div className="sig-source">{s.source} · str {Math.round(s.strength||0)} · {timeAgo(s.ts)}</div>

      <div className="section-block">
        <div className="section-label">Attention State</div>
        <div className="att-btn-row">
          {[['watch','◎ Watch','active-watch'],['focus','◉ Focus','active-focus'],['actioned','✓ Actioned','active-actioned']].map(([state,label,activeClass])=>(
            <button key={state} className={`att-btn${cat.attention===state?' '+activeClass:''}`} onClick={()=>onAttention(cat.id,state)}>{label}</button>
          ))}

      </div>

      {/* Actions */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>onAskSebastian(`Interpret catalyst: "${cat.title.slice(0,80)}". Wave: ${cat.wave}. Confidence: ${cat.confidence}%. Direction: ${cat.direction}. Sources: ${sources.join(', ')}.`)}>
          Ask Sebastian
        </button>
        <button className="btn btn-ghost btn-sm" onClick={()=>onVerify(cat.id)} disabled={verifying}>
          {verifying ? 'Verifying...' : '⊕ Verify (Perplexity)'}
        </button>
        <button className="btn btn-danger btn-sm" onClick={()=>onDismiss(cat.id)}>Dismiss</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   SEBASTIAN TAB
═══════════════════════════════════════════════ */
function SebastianTab({ pendingQuery, onQueryConsumed }) {
  const [msgs, setMsgs]   = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy]   = useState(false);
  const [brief, setBrief] = useState(null);
  const bottomRef = useRef(null);

  useEffect(() => {
    // Load daily brief on mount
    api('/api/sebastian/summarise', { method:'POST' }).then(d=>setBrief(d.brief)).catch(()=>{});
  }, []);

  useEffect(() => {
    if (pendingQuery) {
      setInput(pendingQuery);
      onQueryConsumed?.();
    }
  }, [pendingQuery]);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [msgs]);

  async function send(text) {
    const q = (text||input).trim();
    if (!q || busy) return;
    setInput('');
    setMsgs(prev=>[...prev, { role:'user', text:q }]);
    setBusy(true);
    try {
      const history = msgs.map(m=>({ role:m.role==='user'?'user':'assistant', content:m.text }));
      const data = await api('/api/sebastian/interpret', { method:'POST', body:{ message:q, history } });
      setMsgs(prev=>[...prev, { role:'sebastian', text:data.response }]);
    } catch(e) {
      setMsgs(prev=>[...prev, { role:'sebastian', text:`Error: ${e.message}` }]);
    }
    setBusy(false);
  }

  const shortcuts = [
    'What are the highest conviction signals right now?',
    'Summarise wave transitions in the last 24h',
    'Which catalysts should I focus on?',
    'Explain the current macro regime',
    'What signals need immediate attention?',
  ];

  return (
    <div className="seb-shell">
      <div className="seb-header">
        <div className="seb-engine-label">Interpretation Engine</div>
        <div className="seb-title">Sebastian</div>
        <div className="seb-sub">Catalyst interpretation · Wave analysis · Signal reasoning</div>
      </div>

      <div className="seb-body">
        {/* Daily brief */}
        {brief && (
          <div className="seb-block" style={{borderLeftColor:'var(--accent)',borderLeft:'2px solid var(--accent)'}}>
            <div className="seb-block-label">Daily Intelligence Brief</div>
            <div className="seb-block-text">{brief}</div>
          </div>
        )}

        {msgs.length === 0 && !brief && (
          <div style={{color:'var(--text3)',fontSize:12,padding:'12px 0'}}>Sebastian is ready. Use a shortcut or ask a question.</div>
        )}

        {msgs.map((m,i)=>(
          m.role==='user' ? (
            <div key={i} className="seb-user-block">
              <div className="seb-user-label">You</div>
              <div className="seb-user-text">{m.text}</div>
            </div>
          ) : (
            <div key={i} className="seb-block" style={{borderLeft:'2px solid var(--accent)'}}>
              <div className="seb-block-label">Sebastian</div>
              <div className="seb-block-text">{m.text}</div>
            </div>
          )
        ))}

        {busy && (
          <div className="seb-block loading-pulse" style={{borderLeft:'2px solid var(--accent)'}}>
            <div className="seb-block-label">Sebastian</div>
            <div className="seb-block-text">Interpreting signals...</div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      <div className="seb-shortcuts">
        {shortcuts.map((s,i)=>(
          <button key={i} className="shortcut-btn" onClick={()=>send(s)}>{s}</button>
        ))}
      </div>

      <div className="seb-input-area">
        <textarea className="seb-textarea" rows={1} value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }}
          placeholder="Ask Sebastian to interpret a catalyst, wave, or signal alignment..." />
        <button className="btn btn-primary" onClick={()=>send()} disabled={busy}>Send</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   ASSETS TAB
═══════════════════════════════════════════════ */
function AssetsTab({ onAskSebastian }) {
  const [assets, setAssets]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter]   = useState('all');
  const [addTicker, setAddTicker] = useState('');

  useEffect(() => {
    api('/api/assets').then(d=>{ setAssets(d.assets||[]); setLoading(false); }).catch(()=>setLoading(false));
  }, []);

  async function addWatch(ticker) {
    await api(`/api/profile/watchlist/${ticker.toUpperCase()}`, { method:'POST' }).catch(()=>{});
    setAssets(prev=>prev.map(a=>a.ticker===ticker.toUpperCase()?{...a,on_watchlist:true}:a));
  }

  async function addManual() {
    if (!addTicker.trim()) return;
    await addWatch(addTicker.trim().toUpperCase());
    setAddTicker('');
    // Refresh
    const d = await api('/api/assets').catch(()=>({assets:[]}));
    setAssets(d.assets||[]);
  }

  const filtered = useMemo(()=>{
    if (filter==='catalyst') return assets.filter(a=>a.catalysts?.length>0);
    if (filter==='focus')    return assets.filter(a=>a.on_focus);
    if (filter==='watchlist')return assets.filter(a=>a.on_watchlist);
    if (filter==='actioned') return assets.filter(a=>a.attention==='actioned');
    return assets;
  }, [assets, filter]);

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div>
          <div style={{fontSize:15,fontWeight:600,marginBottom:2}}>Intelligence Index</div>
          <div style={{fontSize:11,color:'var(--text2)'}}>{assets.length} assets tracked · {assets.filter(a=>a.catalysts?.length>0).length} with active catalysts</div>
        </div>
        <div style={{display:'flex',gap:6}}>
          <input value={addTicker} onChange={e=>setAddTicker(e.target.value.toUpperCase())}
            onKeyDown={e=>e.key==='Enter'&&addManual()}
            placeholder="Add ticker..." style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'6px 10px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:12,width:120,outline:'none'}} />
          <button className="btn btn-ghost btn-sm" onClick={addManual}>+ Watch</button>
        </div>
      </div>

      <div className="assets-filter">
        {['all','catalyst','watchlist','focus','actioned'].map(f=>(
          <button key={f} className={`btn btn-ghost btn-sm${filter===f?' active':''}`}
            style={{borderColor:filter===f?'var(--accent)':'',color:filter===f?'var(--accent)':''}}
            onClick={()=>setFilter(f)}>{f}</button>
        ))}
      </div>

      {loading && <div className="empty"><h3>Loading asset intelligence...</h3></div>}
      {!loading && filtered.length===0 && (
        <div className="empty">
          <h3>No assets match this filter</h3>
          <p>Add tickers to your watchlist or start a mission to track assets</p>
        </div>
      )}

      <div className="assets-grid">
        {filtered.map(a=>(
          <div key={a.ticker} className={`asset-card${a.on_focus?' focus-on':a.attention==='actioned'?' actioned-on':a.on_watchlist?' watch-on':''}`}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:2}}>
              <div className="asset-ticker">{a.ticker}</div>
              {a.on_watchlist && !a.on_focus && <span style={{fontSize:9,color:'var(--text3)',fontFamily:'var(--mono)',textTransform:'uppercase'}}>WATCHING</span>}
              {a.on_focus     && <span style={{fontSize:9,color:'var(--amber)',fontFamily:'var(--mono)',textTransform:'uppercase'}}>FOCUS</span>}
            </div>
            <div className="asset-sector">{a.sector||'—'}</div>
            {a.top_conf>0 ? (
              <>
                <div className="asset-conf-num" style={{color:confColor(a.top_conf)}}>{a.top_conf.toFixed(0)}%</div>
                <div style={{display:'flex',gap:5,marginTop:6,flexWrap:'wrap'}}>
                  <WaveBadge wave={a.top_wave} />
                  <DirBadge dir={a.direction} />
                </div>
                <div style={{fontSize:10,color:'var(--text3)',marginTop:6,fontFamily:'var(--mono)'}}>
                  {a.catalysts?.length||0} catalyst{a.catalysts?.length!==1?'s':''}
                </div>
              </>
            ) : (
              <div className="no-signal">No active signals</div>
            )}
            <div style={{display:'flex',gap:5,marginTop:10,flexWrap:'wrap'}}>
              {!a.on_watchlist && <button className="btn btn-ghost btn-sm" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>addWatch(a.ticker)}>+ Watch</button>}
              {a.top_conf>0 && <button className="btn btn-ghost btn-sm" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>onAskSebastian(`What does the ${a.top_wave} wave signal mean for ${a.ticker}? Confidence is ${a.top_conf.toFixed(0)}%, direction ${a.direction}.`)}>Ask Sebastian</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   MISSIONS TAB
═══════════════════════════════════════════════ */
function MissionsTab({ onCreated }) {
  const [missions, setMissions] = useState([]);
  const [mtype, setMtype]       = useState('asset');
  const [target, setTarget]     = useState('');
  const [desc, setDesc]         = useState('');
  const [priority, setPrio]     = useState('normal');
  const [err, setErr]           = useState('');
  const [busy, setBusy]         = useState(false);
  const [loading, setLoading]   = useState(true);

  useEffect(()=>{
    api('/api/missions').then(d=>{ setMissions(d.missions||[]); setLoading(false); }).catch(()=>setLoading(false));
  },[]);

  async function create() {
    if (!target.trim()) { setErr('Enter a target'); return; }
    setErr(''); setBusy(true);
    try {
      const data = await api('/api/missions', { method:'POST', body:{ mission_type:mtype, target:target.trim(), description:desc, priority } });
      setMissions(prev=>[data.mission,...prev]);
      setTarget(''); setDesc('');
      onCreated?.();
    } catch(e) { setErr(e.message); }
    setBusy(false);
  }

  async function cancel(id) {
    await api(`/api/missions/${id}`,{method:'DELETE'}).catch(()=>{});
    setMissions(prev=>prev.filter(m=>m.id!==id));
  }

  const types = [
    { id:'asset',    icon:'◈', label:'Asset',    example:'NVDA, AAPL' },
    { id:'sector',   icon:'◫', label:'Sector',   example:'Technology, Energy' },
    { id:'theme',    icon:'◎', label:'Theme',    example:'AI, Defence' },
    { id:'region',   icon:'◉', label:'Region',   example:'Middle East, Asia' },
    { id:'macro',    icon:'◆', label:'Macro',    example:'Fed rates, CPI' },
    { id:'industry', icon:'◌', label:'Industry', example:'Semiconductors' },
  ];

  const placeholders = { asset:'e.g. NVDA', sector:'e.g. Technology', theme:'e.g. AI Infrastructure', region:'e.g. Middle East', macro:'e.g. Fed interest rates', industry:'e.g. Semiconductors' };

  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:15,fontWeight:600,marginBottom:2}}>Missions</div>
        <div style={{fontSize:11,color:'var(--text2)'}}>Send Sebastian to track an asset, sector, theme, or macro indicator</div>
      </div>

      <div className="card" style={{marginBottom:24}}>
        <div className="card-head"><span className="card-title">New Mission</span></div>
        <div className="card-body">
          <div style={{marginBottom:14}}>
            <div className="section-label">Mission Type</div>
            <div className="mission-type-grid">
              {types.map(t=>(
                <button key={t.id} className={`mtype-btn${mtype===t.id?' sel':''}`} onClick={()=>setMtype(t.id)}>
                  <div className="mtype-icon">{t.icon}</div>
                  <div>{t.label}</div>
                  <div style={{fontSize:9,color:'var(--text3)',marginTop:3}}>{t.example}</div>
                </button>
              ))}
            </div>
          </div>

          <div className="field">
            <label>Target</label>
            <input value={target} onChange={e=>setTarget(e.target.value)} placeholder={placeholders[mtype]} onKeyDown={e=>e.key==='Enter'&&create()} />
          </div>
          <div className="field">
            <label>Description (optional)</label>
            <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="What specifically should Sebastian track?" />
          </div>

          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
            <span style={{fontSize:11,color:'var(--text2)'}}>Priority:</span>
            {['normal','high','critical'].map(p=>(
              <button key={p} className={`btn btn-ghost btn-sm`}
                style={{borderColor:priority===p?(p==='critical'?'var(--red)':p==='high'?'var(--amber)':'var(--accent)'):'',
                  color:priority===p?(p==='critical'?'var(--red)':p==='high'?'var(--amber)':'var(--accent)'):'',
                  textTransform:'uppercase',fontSize:10,fontFamily:'var(--mono)'}}
                onClick={()=>setPrio(p)}>{p}</button>
            ))}
          </div>

          {err && <div className="err-box" style={{marginBottom:12}}>{err}</div>}
          <button className="btn btn-primary" style={{width:'100%'}} onClick={create} disabled={busy}>
            {busy ? 'Launching...' : '◎ Launch Mission'}
          </button>
        </div>
      </div>

      <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.07em',color:'var(--text2)',marginBottom:10}}>
        Active Missions ({missions.length})
      </div>
      <div className="card">
        {loading && <div style={{padding:16,color:'var(--text3)',fontSize:12}}>Loading missions...</div>}
        {!loading && missions.length===0 && (
          <div className="empty" style={{padding:28}}><h3>No active missions</h3><p>Launch a mission above to start tracking</p></div>
        )}
        {missions.map(m=>(
          <div key={m.id} className="mission-item">
            <div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <div className="mission-target">{m.target}</div>
                <span className={`prio-badge prio-${m.priority}`}>{m.priority}</span>
                <span style={{fontSize:10,color:'var(--text3)',fontFamily:'var(--mono)',textTransform:'uppercase'}}>{m.type}</span>
              </div>
              <div className="mission-desc">{m.description?.slice(0,80)}</div>
            </div>
            <button className="btn btn-danger btn-sm" onClick={()=>cancel(m.id)} style={{flexShrink:0}}>Cancel</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   CHAIN STATUS MODAL
═══════════════════════════════════════════════ */
function ChainModal({ onClose }) {
  const [chain, setChain] = useState(null);
  useEffect(()=>{
    api('/api/chain/status').then(setChain).catch(()=>{});
  },[]);

  function statusEl(val) {
    if (val===true||val==='integrated'||val==='connected') return <span className="chain-ok">✓ active</span>;
    if (val===false||val==='memory_fallback') return <span className="chain-warn">{typeof val==='string'?val:'✗ inactive'}</span>;
    return <span className="chain-ok">{val}</span>;
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Signal Chain — Phase 1 Status</div>
        {!chain && <div style={{color:'var(--text2)',fontSize:12}}>Checking chain...</div>}
        {chain && Object.entries(chain.chain).map(([k,v])=>(
          <div key={k} className="chain-row">
            <span style={{fontFamily:'var(--mono)',fontSize:11}}>{k.replace(/_/g,' ')}</span>
            {statusEl(v)}
          </div>
        ))}
        {chain?.counts && (
          <div style={{marginTop:12,padding:'8px 11px',background:'var(--bg4)',borderRadius:'var(--r)',fontSize:11,color:'var(--text2)',fontFamily:'var(--mono)'}}>
            {chain.counts.active_catalysts} active catalysts · {chain.counts.missions} missions
          </div>
        )}
        {chain?.warnings?.map((w,i)=>(
          <div key={i} style={{marginTop:6,fontSize:11,color:'var(--amber)'}}>⚠ {w}</div>
        ))}
        <button className="btn btn-ghost" style={{marginTop:16,width:'100%'}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════ */
function App() {
  const [user, setUser]         = useState(null);
  const [checking, setChecking] = useState(true);
  const [tab, setTab]           = useState('intelligence');
  const [catalysts, setCatalysts] = useState([]);
  const [selected, setSelected] = useState(null);
  const [catsLoading, setCatsLoading] = useState(true);
  const [verifying, setVerifying] = useState(false);
  const [showChain, setShowChain] = useState(false);
  const [sebQuery, setSebQuery] = useState('');
  const [refreshTs, setRefreshTs] = useState(null);

  // Restore session
  useEffect(()=>{
    if (_token) {
      api('/api/auth/me').then(u=>{ setUser(u); setChecking(false); })
        .catch(()=>{ _token=''; localStorage.removeItem('mb_token'); setChecking(false); });
    } else { setChecking(false); }
  },[]);

  const fetchCatalysts = useCallback(async()=>{
    setCatsLoading(true);
    try {
      const d = await api('/api/cos/catalysts?status=active');
      setCatalysts(d.catalysts||[]);
      setRefreshTs(new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    } catch(e) {}
    setCatsLoading(false);
  },[]);

  useEffect(()=>{
    if (user) {
      fetchCatalysts();
      const t = setInterval(fetchCatalysts, 30000);
      return ()=>clearInterval(t);
    }
  },[user, fetchCatalysts]);

  async function handleAttention(catId, state) {
    await api('/api/cos/attention',{method:'POST',body:{catalyst_id:catId,state}});
    const update = c => c.id===catId ? {...c,attention:state} : c;
    setCatalysts(prev=>prev.map(update));
    setSelected(s=>s?.id===catId ? {...s,attention:state} : s);
  }

  async function handleVerify(catId) {
    setVerifying(true);
    try {
      const data = await api(`/api/perplexity/verify?catalyst_id=${catId}`,{method:'POST'});
      setCatalysts(prev=>prev.map(c=>c.id===catId ? {...c, confidence:data.confidence_after, wave:data.wave_after, verified:true} : c));
      setSelected(s=>s?.id===catId ? {...s, confidence:data.confidence_after, wave:data.wave_after, verified:true} : s);
    } catch(e) { alert('Verification failed: '+e.message); }
    setVerifying(false);
  }

  async function handleDismiss(catId) {
    await api(`/api/cos/catalyst/${catId}`,{method:'DELETE'});
    setCatalysts(prev=>prev.filter(c=>c.id!==catId));
    if (selected?.id===catId) setSelected(null);
  }

  function handleAskSebastian(q) {
    setSebQuery(q);
    setTab('sebastian');
  }

  function logout() {
    api('/api/auth/logout',{method:'POST'}).catch(()=>{});
    _token=''; localStorage.removeItem('mb_token');
    setUser(null); setCatalysts([]); setSelected(null);
  }

  if (checking) return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}}>Loading...</div>;
  if (!user)    return <AuthScreen onAuth={setUser} />;

  const focusCount    = catalysts.filter(c=>c.attention==='focus').length;
  const actionedCount = catalysts.filter(c=>c.attention==='actioned').length;
  const highConf      = catalysts.filter(c=>c.confidence>=65).length;

  return (
    <div className="shell">
      {showChain && <ChainModal onClose={()=>setShowChain(false)} />}

      {/* Topbar */}
      <div className="topbar">
        <div style={{display:'flex',alignItems:'center'}}>
          <div className="logo">
            <div className="logo-mark">M</div>
            <span>Market Brain</span>
          </div>
          <nav className="nav">
            {[
              ['intelligence','Intelligence'],
              ['sebastian','Sebastian'],
              ['assets','Assets'],
              ['missions','Missions'],
            ].map(([id,label])=>(
              <button key={id} className={`nav-btn${tab===id?' active':''}`} onClick={()=>setTab(id)}>{label}</button>
            ))}
          </nav>
        </div>

        <div className="topbar-right">
          {highConf>0 && <span style={{fontSize:11,color:'var(--green)',fontFamily:'var(--mono)'}}>▲ {highConf} high</span>}
          {focusCount>0 && <span style={{fontSize:11,color:'var(--amber)',fontFamily:'var(--mono)'}}>◉ {focusCount} focus</span>}
          {actionedCount>0 && <span style={{fontSize:11,color:'var(--green)',fontFamily:'var(--mono)'}}>✓ {actionedCount} actioned</span>}
          <div className="pill" onClick={()=>setShowChain(true)} data-tip="View signal chain status">
            <div className="dot" style={{background:'var(--green)'}} />
            <span style={{fontFamily:'var(--mono)',fontSize:10}}>chain · {refreshTs||'—'}</span>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={fetchCatalysts}>↻</button>
          <button className="btn btn-ghost btn-sm" onClick={logout} style={{color:'var(--text3)'}}>Sign out</button>
        </div>
      </div>

      {/* Main */}
      <div className="main">
        {/* Intelligence tab */}
        {tab==='intelligence' && (
          <>
            <CatalystSidebar
              cats={catalysts}
              selected={selected}
              onSelect={setSelected}
              loading={catsLoading}
              onNew={()=>setTab('missions')}
            />
            <div className="content">
              <CatalystDetail
                cat={selected}
                onAttention={handleAttention}
                onVerify={handleVerify}
                onDismiss={handleDismiss}
                onAskSebastian={handleAskSebastian}
                verifying={verifying}
              />
            </div>
          </>
        )}

        {/* Sebastian tab — full width, no sidebar */}
        {tab==='sebastian' && (
          <div style={{flex:1,overflow:'hidden'}}>
            <SebastianTab pendingQuery={sebQuery} onQueryConsumed={()=>setSebQuery('')} />
          </div>
        )}

        {/* Assets tab */}
        {tab==='assets' && (
          <div className="content" style={{flex:1}}>
            <AssetsTab onAskSebastian={handleAskSebastian} />
          </div>
        )}

        {/* Missions tab */}
        {tab==='missions' && (
          <div className="content" style={{flex:1,maxWidth:680}}>
            <MissionsTab onCreated={fetchCatalysts} />
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
