*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020207;color:#c8cce8;font-family:'IBM Plex Mono',monospace;height:100vh;overflow:hidden;font-size:11px;}
:root{
  --bg0:#020207;--bg1:#05050f;--bg2:#08081a;--bg3:#0d0d22;
  --border:#111128;--border2:#1a1a35;
  --text:#c8cce8;--text2:#6a6a9a;--text3:#2e2e50;
  --blue:#3d9eff;--green:#00d68f;--red:#ff4d6a;--yellow:#f5c842;--orange:#ff7a3d;--purple:#a78bfa;
}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:var(--bg1);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.card-enter{animation:fadeUp 0.18s ease forwards;}
input,button{font-family:inherit;outline:none;}
button{cursor:pointer;}

/* ── WAVE BADGE COLOURS ── */
.wave-spark{color:#888;border-color:#33333a;}
.wave-confirmed{color:var(--blue);border-color:#1e3a5f;}
.wave-escalation{color:var(--yellow);border-color:#3d3010;}
.wave-structural{color:var(--orange);border-color:#3d1a08;}
.wave-regime{color:var(--red);border-color:#3d0818;}

/* ── BIAS ── */
.bias-bullish{color:var(--green);}
.bias-bearish{color:var(--red);}
.bias-neutral{color:var(--text2);}

/* ── CARD ── */
.intel-card{
  background:var(--bg1);
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px 9px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:border-color 0.15s, background 0.15s;
}
.intel-card:hover{border-color:var(--border2);background:var(--bg2);}
.intel-card.selected{border-color:var(--blue);background:var(--bg2);}
.intel-card .accent-bar{position:absolute;top:0;left:0;right:0;height:1.5px;}

/* ── BAR ── */
.bar-track{height:2px;background:var(--bg3);border-radius:1px;overflow:hidden;}
.bar-fill{height:100%;border-radius:1px;}

/* ── BTN ── */
.btn{border-radius:4px;padding:4px 8px;font-size:9px;letter-spacing:.5px;border:1px solid;transition:all 0.15s;}
.btn-watch{background:transparent;border-color:#2a2a45;color:var(--text2);}
.btn-watch:hover{border-color:var(--yellow);color:var(--yellow);}
.btn-watch.active{border-color:var(--yellow);color:var(--yellow);background:#f5c84210;}
.btn-ask{background:transparent;border-color:#1e3a5f;color:var(--blue);}
.btn-ask:hover{background:#3d9eff18;border-color:var(--blue);}
.btn-sm{padding:3px 7px;font-size:8px;}

/* ── PILL ── */
.pill{border:1px solid var(--border2);border-radius:10px;padding:2px 8px;font-size:8px;letter-spacing:.5px;cursor:pointer;white-space:nowrap;background:transparent;color:var(--text3);transition:all 0.12s;}
.pill.active{background:var(--bg3);color:var(--text);}
.pill:hover:not(.active){color:var(--text2);}

/* ── PANEL ── */
.detail-panel{animation:slidein 0.2s ease;}
.section-label{font-size:7px;letter-spacing:2px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:#000000cc;z-index:600;display:flex;align-items:center;justify-content:center;padding:12px;}
.modal-box{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;max-height:92vh;overflow-y:auto;}

/* ── INPUT ── */
.input-dark{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:6px 9px;color:var(--text);font-size:11px;font-family:inherit;width:100%;}
.input-dark::placeholder{color:var(--text3);}
.input-dark:focus{border-color:var(--blue);}

/* ── STAT BOX ── */
.stat-box{background:var(--bg2);border-radius:4px;padding:6px 8px;text-align:center;}
.stat-box .label{font-size:6px;color:var(--text3);letter-spacing:1.5px;margin-bottom:2px;}
.stat-box .value{font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;}

/* ── SIGNAL ROW ── */
.signal-row{padding:5px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start;}
.signal-row:last-child{border-bottom:none;}
.bot-tag{font-size:7px;letter-spacing:1px;border:1px solid;border-radius:3px;padding:1px 4px;white-space:nowrap;flex-shrink:0;}

const API="";
const api=async(path,opts={})=>{
  const token=localStorage.getItem("mb_token");
  const headers={"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{})};
  const res=await fetch(API+path,{headers,...opts});
  const j=await res.json();
  if(!res.ok)throw new Error(j.detail||"Request failed");
  return j;
};
async function fetchLivePrices(tickers){
  try{
    const chunks=[];for(let i=0;i<tickers.length;i+=40)chunks.push(tickers.slice(i,i+40));
    const results={};
    for(const chunk of chunks){const j=await api(`/api/prices?symbols=${chunk.join(",")}`);Object.assign(results,j.data||{});}
    return Object.keys(results).length?results:null;
  }catch{return null;}
}
async function fetchFxRates(){
  try{
    const pairs="GBPUSD=X,GBPEUR=X,GBPJPY=X,GBPCAD=X,GBPAUD=X,GBPCHF=X";
    const j=await api(`/api/prices?symbols=${pairs}`);
    if(!j.data)return null;
    const rates={GBP:1.0};
    const map={"GBPUSD=X":"USD","GBPEUR=X":"EUR","GBPJPY=X":"JPY","GBPCAD=X":"CAD","GBPAUD=X":"AUD","GBPCHF=X":"CHF"};
    Object.entries(map).forEach(([sym,code])=>{const d=j.data[sym];if(d?.price)rates[code]=parseFloat(d.price);});
    return rates;
  }catch{return null;}
}

function generateIntelligence(asset, sessionKey){
  const s=asset.ticker.split("").reduce((a,c)=>a+c.charCodeAt(0),0)+sessionKey;
  const r=(o=0)=>sr(s+o,-1,1);
  const rn=(min,max,o=0)=>sr(s+o,min,max);

  // Determine which bots fired
  const botCount=Math.floor(rn(1,BOTS.length,1));
  const shuffled=[...BOTS].sort((_,__)=>sr(s+__.charCodeAt?__.charCodeAt(0):0,-1,1));
  const activeBots=shuffled.slice(0,Math.min(botCount,5));

  // Signal packets per active bot
  const signals=activeBots.map((bot,i)=>{
    const templates=SIGNAL_TEMPLATES[bot];
    const idx=Math.floor(rn(0,templates.length,i*7));
    const strength=parseFloat(rn(0.3,0.95,i*13).toFixed(2));
    const bullish=r(i*19)>-0.1;
    return{bot,text:templates[idx]||templates[0],strength,bullish};
  });

  // Confidence score (0-100)
  const baseConf=rn(20,92,99);
  const verificationBonus=activeBots.length>=3?12:activeBots.length>=2?6:0;
  const confidence=Math.min(99,Math.round(baseConf+verificationBonus));

  // Intensity (signal alignment strength)
  const bullishSignals=signals.filter(s=>s.bullish).length;
  const alignment=bullishSignals/Math.max(signals.length,1);
  const intensity=Math.round((alignment*0.6+rn(0.1,0.5,88)*0.4)*100);

  // Wave state (evidence-gated)
  let wave="spark";
  if(confidence>=42&&activeBots.length>=2)wave="confirmed";
  if(confidence>=58&&activeBots.length>=2)wave="escalation";
  if(confidence>=72&&activeBots.length>=3)wave="structural";
  if(confidence>=85&&activeBots.length>=4)wave="regime";

  // Override with some forced variety for demo
  const forceWave=["spark","spark","confirmed","confirmed","confirmed","escalation","escalation","structural","regime"];
  wave=forceWave[Math.floor(rn(0,forceWave.length,77))];

  // Bias
  const biasScore=alignment*100-(100-intensity)*0.3;
  const bias=biasScore>58?"bullish":biasScore<40?"bearish":"neutral";

  // Price range by sector
  const priceRanges={
    Shipping:[10,80],Defence:[200,600],Energy:[20,130],Technology:[15,900],
    Metals:[15,250],Minerals:[2,80],Insurance:[50,600],Finance:[50,600],
    Crypto:[0.5,100000],Logistics:[80,300],Consumer:[50,500],Forex:[0.6,200],
  };
  const[pMin,pMax]=priceRanges[asset.sector]||[10,500];
  const price=parseFloat(rn(pMin,pMax,55).toFixed(asset.sector==="Crypto"&&pMax>1000?0:2));
  const changePct=parseFloat(rn(-8,8,66).toFixed(2));

  // Perplexity verdict (simulated)
  const verdicts=["supported","supported","mixed","weak","contradicted"];
  const verdict=verdicts[Math.floor(rn(0,verdicts.length,101))];
  const verScore=verdict==="supported"?0.7:verdict==="mixed"?0.2:verdict==="weak"?-0.1:-0.5;

  // Sebastian prompt
  const sbPrompt=SEBASTIAN_PROMPTS[bias]?.[wave]||SEBASTIAN_PROMPTS.neutral.spark;

  return{
    confidence,intensity,wave,bias,signals,activeBots,
    price,changePct,livePrice:false,marketState:"CLOSED",
    perplexity:{verdict,score:verScore,
      summary:verdict==="supported"?"Independent verification confirms the thesis across multiple sources.":
               verdict==="mixed"?"Mixed signals from external verification — proceed with caution.":
               verdict==="weak"?"Weak external support — signals may be noise.":
               "External data contradicts internal signals — risk elevated."},
    fundamentals:{pe:parseFloat(rn(3,45,201).toFixed(1)),debtEquity:parseFloat(rn(0,3,202).toFixed(2)),revGrowth:parseFloat(rn(-20,80,203).toFixed(1))},
    technical:{rsi:parseFloat(rn(18,82,204).toFixed(0)),volume:parseFloat(rn(0.4,4,205).toFixed(1)),macd:parseFloat(rn(-1,1,206).toFixed(2))},
    sbPrompt,
  };
}

  if(!live?.price)return intel;
  const realPrice=live.currency==="GBX"?live.price/100:live.price;

function BiasIcon({bias}){
  if(bias==="bullish")return<span style={{color:"#00d68f",fontSize:8}}>▲ BULL</span>;
  if(bias==="bearish")return<span style={{color:"#ff4d6a",fontSize:8}}>▼ BEAR</span>;
  return<span style={{color:"#6a6a9a",fontSize:8}}>◆ NEUTRAL</span>;
}

function MiniBar({value,color,max=100}){
  const pct=Math.max(0,Math.min(100,(value/max)*100));
  return(
    <div className="bar-track" style={{width:"100%"}}>
      <div className="bar-fill" style={{width:`${pct}%`,background:color}}/>
    </div>
  );
}

function StatBox({label,value,color="#c8cce8",sub}){
  return(
    <div className="stat-box">
      <div className="label">{label}</div>
      <div className="value" style={{color}}>{value}</div>
      {sub&&<div style={{fontSize:7,color:"#3a3a60",marginTop:1}}>{sub}</div>}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  SEBASTIAN API  (routes through backend — API key server-side)
// ─────────────────────────────────────────────────────────────
async function callSebastian(question, history=[], mode="auto", context={}){
  // Sebastian — analyst endpoint
  const j=await api("/api/sebastian",{
    method:"POST",
    body:JSON.stringify({question,history,mode,context}),
  });
  return {response:j.response||"No response received.", agent:"sebastian"};
}

async function callPersona(question, history=[], mode="auto", context={}){
  // Persona Bot — trading-style interpreter endpoint (separate)
  const j=await api("/api/persona",{
    method:"POST",
    body:JSON.stringify({question,history,mode,context}),
  });
  return {response:j.response||"No response received.", agent:"persona"};
}

// Persona Bot trigger phrases — used by auto-routing
const PERSONA_TRIGGERS=[
  "momentum trader","defensive allocator","macro swing","swing trader",
  "value investor","contrarian","technical trader","risk-off","risk-on",
  "how would a","how does a","from a trader","trading style","event-driven",
  "growth investor","how a trader","what would a","through the lens",
  "commodities specialist","geopolitical risk trader","quant trader",
  "mean-reversion","risk-on allocator","risk-off allocator",
];

function detectAgent(question, forcedAgent="auto"){
  if(forcedAgent==="sebastian") return "sebastian";
  if(forcedAgent==="persona")   return "persona";
  const q=question.toLowerCase();
  return PERSONA_TRIGGERS.some(t=>q.includes(t)) ? "persona" : "sebastian";
}

            const bc=BOT_COLORS[s.source||s.bot]||"#6a6a9a";
            return(
              <div key={i} className="signal-row">
                <span className="bot-tag" style={{color:bc,borderColor:bc+"44"}}>{(s.source||s.bot||"BOT").replace("Bot","").toUpperCase()}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:8,color:"#b0b4d0",lineHeight:1.4}}>{s.summary||s.text||""}</div>
                  <div style={{fontSize:7,color:"var(--text3)",marginTop:2}}>STR {s.strength||0} · {s.ts?new Date(s.ts*1000).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"--:--"}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Scope */}
      {((cat.assets||[]).length>0||(cat.sectors||[]).length>0)&&(
        <div style={{background:"var(--bg2)",borderRadius:5,padding:"8px 10px",border:"1px solid var(--border)"}}>
          <div className="section-label">SCOPE</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
            {(cat.assets||[]).map(a=><span key={a} style={{fontSize:8,color:"var(--blue)",border:"1px solid var(--blue)22",borderRadius:3,padding:"1px 5px"}}>{a}</span>)}
            {(cat.sectors||[]).map(s=><span key={s} style={{fontSize:8,color:"var(--text2)",border:"1px solid var(--border2)",borderRadius:3,padding:"1px 5px"}}>{s}</span>)}
          </div>
        </div>
      )}

      {/* Ask Sebastian */}
      <button onClick={()=>onAskSebastian(cat)} className="btn btn-ask" style={{width:"100%",padding:"8px",fontSize:9}}>
        Ask Sebastian about this catalyst →
      </button>
    </div>
  );
}

function CatalystView({fmtMoney}){
  const[catalysts,setCatalysts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[selected,setSelected]=useState(null);
  const[filter,setFilter]=useState("all");
  const[sebastianTarget,setSebastianTarget]=useState(null);

  const load=useCallback(async()=>{
    try{
      const j=await api("/api/catalysts");
      const cats=j.catalysts||j||[];
      const wave_order={regime:5,structural:4,escalation:3,confirmed:2,spark:1};
      cats.sort((a,b)=>(wave_order[b.wave]||0)-(wave_order[a.wave]||0)||(b.confidence||0)-(a.confidence||0));
      setCatalysts(cats);
    }catch(e){
      setCatalysts([]);
    }
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[]);
  useEffect(()=>{const t=setInterval(load,15000);return()=>clearInterval(t);},[]);

  const filtered=catalysts.filter(c=>{
    if(filter==="focus")return c.attention==="focus";
    if(filter==="high")return(c.confidence||0)>=65;
    if(filter==="verified")return c.verified;
    if(filter==="escalation")return["escalation","structural","regime"].includes(c.wave);
    return true;
  });

  const waveCounts={spark:0,confirmed:0,escalation:0,structural:0,regime:0};
  catalysts.forEach(c=>{if(waveCounts[c.wave]!==undefined)waveCounts[c.wave]++;});

  return(
    <div style={{flex:1,display:"flex",overflow:"hidden",minHeight:0}}>
      {sebastianTarget&&(
        <SebastianPage
          initialQuestion={`Tell me about this catalyst: ${sebastianTarget.title||sebastianTarget.headline}`}
          initialContext={{catalyst:sebastianTarget}}
          onClose={()=>setSebastianTarget(null)}
          asModal
        />
      )}
      {/* Left: catalyst list */}
      <div style={{width:280,borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",flexShrink:0}}>
        {/* Header */}
        <div style={{padding:"8px 10px",borderBottom:"1px solid var(--border)",background:"var(--bg1)",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:8,color:"var(--text3)",letterSpacing:2}}>CATALYSTS</span>
            <span style={{fontSize:9,color:"var(--text2)",fontFamily:"monospace"}}>{catalysts.length} active</span>
          </div>
          {/* Wave summary */}
          <div style={{display:"flex",gap:3,marginBottom:6}}>
            {Object.entries(waveCounts).filter(([,v])=>v>0).map(([wave,count])=>{
              const wc=WAVE_CFG[wave];
              return<div key={wave} style={{flex:1,textAlign:"center",background:wc.bg,border:`1px solid ${wc.color}44`,borderRadius:3,padding:"2px"}}>
                <div style={{fontSize:8,color:wc.color,fontWeight:700}}>{count}</div>
                <div style={{fontSize:5.5,color:wc.color,opacity:.7}}>{wc.label.slice(0,4)}</div>
              </div>;
            })}
          </div>
          {/* Filters */}
          <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
            {[["all","ALL"],["focus","FOCUS"],["escalation","ESC+"],["verified","✓ VER"],["high","HIGH"]].map(([v,l])=>(
              <button key={v} className={`pill${filter===v?" active":""}`} onClick={()=>setFilter(v)} style={{fontSize:7,padding:"2px 6px"}}>{l}</button>
            ))}
          </div>
        </div>
        {/* List */}
        <div style={{flex:1,overflowY:"auto",padding:6,display:"flex",flexDirection:"column",gap:4}}>
          {loading&&<div style={{textAlign:"center",padding:20,color:"var(--text3)",fontSize:9}}>Loading catalysts...</div>}
          {!loading&&filtered.length===0&&<div style={{textAlign:"center",padding:20,color:"var(--text3)",fontSize:9}}>No catalysts match this filter.</div>}
          {filtered.map(cat=>(
            <CatalystCard key={cat.id} cat={cat} selected={selected} onSelect={setSelected}/>
          ))}
        </div>
      </div>

      {/* Right: detail or empty state */}
      <div style={{flex:1,overflow:"hidden",background:"var(--bg1)"}}>
        {selected?(
          <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"6px 10px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--bg2)",flexShrink:0}}>
              <span style={{fontSize:7,color:"var(--text3)",letterSpacing:2}}>CATALYST DETAIL</span>
              <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:14}}>×</button>
            </div>
            <CatalystDetail cat={selected} fmtMoney={fmtMoney} onAskSebastian={cat=>{setSebastianTarget(cat);}}/>
          </div>
        ):(
          <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8}}>
            <div style={{fontSize:24,color:"var(--text3)"}}>◈</div>
            <div style={{fontSize:9,color:"var(--text3)"}}>Select a catalyst to view detail</div>
            <div style={{fontSize:8,color:"var(--text3)",opacity:.5}}>{catalysts.length} active · auto-refreshing</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  SEBASTIAN PAGE  (full dedicated view + modal mode)
// ─────────────────────────────────────────────────────────────
function SebastianPage({initialQuestion="",initialContext={},onClose,asModal=false}){
  const[messages,setMessages]=useState([]);
  const[input,setInput]=useState(initialQuestion);
  const[loading,setLoading]=useState(false);
  const[mode,setMode]=useState("auto");
  const[agent,setAgent]=useState("auto"); // auto | sebastian | persona
  const bottomRef=useRef(null);

  const AGENT_CFG={
    sebastian:{label:"SEBASTIAN",color:"var(--blue)",desc:"Analyst · Catalyst breakdown · Signal interpretation"},
    persona:{label:"PERSONA BOT",color:"var(--purple)",desc:"Trading-style interpreter · How different traders see it"},
    auto:{label:"AUTO",color:"var(--text3)",desc:"Routes automatically based on your question"},
  };

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages]);

  // Auto-send if opened with initial question (from catalyst)
  useEffect(()=>{
    if(initialQuestion){
      setMessages([]);
      setTimeout(()=>sendMessage(initialQuestion),100);
    }else{
      // Auto-fetch landscape brief on open
    setLoading(true);
    callSebastian(
      "Give me a concise intelligence landscape overview right now. Cover: (1) the highest-wave catalyst and what's driving it, (2) which sectors are most active, (3) the overall market direction bias, and (4) the top 2-3 assets I should be watching. Keep it tight — 4-5 short paragraphs.",
      [],
      mode,
      {},
    ).then(result=>{
      const reply=typeof result==="string"?result:result.response;
      setMessages([{role:"assistant",content:reply,agent:"sebastian"}]);
      setLoading(false);
    }).catch(()=>{
      setMessages([{role:"assistant",content:"Hi — I'm Sebastian. I have live prices and the full intelligence chain loaded.\n\nAsk me anything about the market, a specific catalyst, or what the bots are seeing right now."}]);
      setLoading(false);
    });
    }
  },[]);

  const sendMessage=async(q)=>{
    const question=(q||input).trim();
    if(!question||loading)return;
    setInput("");
    const userMsg={role:"user",content:question};
    setMessages(p=>[...p,userMsg]);
    setLoading(true);
    try{
      // Route to the correct endpoint based on agent selector or auto-detection
      const activeAgent=detectAgent(question,agent);
      const callFn=activeAgent==="persona"?callPersona:callSebastian;
      const result=await callFn(
        question,
        messages.slice(-10),
        mode,
        initialContext,
      );
      setMessages(p=>[...p,{role:"assistant",content:result.response,agent:result.agent}]);
    }catch(e){
      setMessages(p=>[...p,{role:"assistant",content:`Sorry, I had trouble with that. Error: ${e.message||"unknown"}. Please try again.`,agent:"sebastian"}]);
    }
    setLoading(false);
  };

  const SUGGESTED=[
    "What's the strongest signal right now?",
    "Walk me through the top catalyst",
    "Which sectors are most active?",
    "Explain the current wave states",
    "What should I be watching today?",
    "Any cross-asset alignment?",
  ];

  const content=(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* Header */}
      <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border2)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,background:"var(--bg2)"}}>
        <div>
          <div style={{fontFamily:"'Barlow Condensed'",fontSize:15,fontWeight:700,color:"#e0e4ff",letterSpacing:1}}>SEBASTIAN</div>
          <div style={{fontSize:7,color:"var(--text3)",marginTop:1}}>
            {agent==="persona"?"Persona Bot · "+AGENT_CFG.persona.desc
             :agent==="sebastian"?"Sebastian · "+AGENT_CFG.sebastian.desc
             :"Auto-routing · Live prices · Intelligence chain"}
          </div>
        </div>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          {/* Agent selector */}
          <div style={{display:"flex",gap:3}}>
            {[["auto","AUTO"],["sebastian","SEBASTIAN"],["persona","PERSONA"]].map(([v,l])=>{
              const ac=AGENT_CFG[v]||AGENT_CFG.auto;
              return(
                <button key={v} onClick={()=>setAgent(v)} style={{
                  background:agent===v?ac.color+"22":"transparent",
                  border:`1px solid ${agent===v?ac.color+"55":"var(--border)"}`,
                  borderRadius:4,padding:"3px 8px",
                  color:agent===v?ac.color:"var(--text3)",
                  fontSize:7,letterSpacing:.5
                }}>{l}</button>
              );
            })}
          </div>
          {/* Mode selector */}
          <div style={{display:"flex",border:"1px solid var(--border2)",borderRadius:4,overflow:"hidden"}}>
            {[["auto","AUTO"],["beginner","SIMPLE"],["expert","EXPERT"]].map(([v,l])=>(
              <button key={v} onClick={()=>setMode(v)} style={{background:mode===v?"var(--blue)22":"transparent",border:"none",padding:"3px 7px",color:mode===v?"var(--blue)":"var(--text3)",fontSize:7,letterSpacing:.5}}>{l}</button>
            ))}
          </div>
          {onClose&&<button onClick={onClose} style={{background:"none",border:"none",color:"var(--text3)",fontSize:16,lineHeight:1}}>×</button>}
        </div>
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:"auto",padding:"10px 14px",display:"flex",flexDirection:"column",gap:7}}>
        {messages.map((m,i)=>(
          <div key={i} style={{
            alignSelf:m.role==="user"?"flex-end":"flex-start",
            maxWidth:"88%",
            background:m.role==="user"?"#1e3a5f":"var(--bg3)",
            border:`1px solid ${m.role==="user"?"var(--blue)33":"var(--border)"}`,
            borderRadius:6,padding:"8px 10px",
            animation:"fadeUp 0.15s ease",
          }}>
            {(()=>{
              if(m.role==="user") return <div style={{fontSize:7,color:"var(--blue)",letterSpacing:1,marginBottom:3}}>YOU</div>;
              const ac=AGENT_CFG[m.agent||"sebastian"]||AGENT_CFG.sebastian;
              return <div style={{fontSize:7,color:ac.color,letterSpacing:1,marginBottom:3}}>{ac.label}</div>;
            })()}
            <div style={{fontSize:10,color:"#b0b4d0",lineHeight:1.65,whiteSpace:"pre-wrap"}}>{m.content}</div>
          </div>
        ))}
        {loading&&(
          <div style={{alignSelf:"flex-start",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:6,padding:"8px 12px"}}>
            <span style={{fontSize:9,color:"var(--text3)",animation:"pulse 1.2s infinite"}}>Sebastian is thinking...</span>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Suggested questions (only when few messages) */}
      {messages.length<=2&&!loading&&(
        <div style={{padding:"0 14px 6px",display:"flex",flexWrap:"wrap",gap:4,flexShrink:0}}>
          {SUGGESTED.map(q=>(
            <button key={q} onClick={()=>sendMessage(q)} style={{background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:4,padding:"4px 8px",color:"var(--text2)",fontSize:8,cursor:"pointer"}}>
              {q}
            </button>
          ))}
        </div>
      )}

      {/* Input */}
      <div style={{padding:"8px 12px",borderTop:"1px solid var(--border)",display:"flex",gap:6,flexShrink:0,background:"var(--bg1)"}}>
        <input
          className="input-dark"
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendMessage()}
          placeholder="Ask Sebastian anything about the market..."
          style={{flex:1}}
        />
        <button
          onClick={()=>sendMessage()}
          disabled={!input.trim()||loading}
          style={{background:input.trim()&&!loading?"#1e3a5f":"var(--bg3)",border:`1px solid ${input.trim()&&!loading?"var(--blue)44":"var(--border)"}`,borderRadius:4,padding:"6px 12px",color:input.trim()&&!loading?"var(--blue)":"var(--text3)",fontSize:9,flexShrink:0}}
        >
          SEND →
        </button>
      </div>
    </div>
  );

  if(asModal){
    return(
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" style={{width:"100%",maxWidth:600,height:"78vh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
          {content}
        </div>
      </div>
    );
  }
  return content;
}

        <div style={{fontSize:11,color:"var(--text2)",maxWidth:440,lineHeight:1.8,marginBottom:36}}>
          Nine research bots. One chief of staff. Real-time wave analysis. Market Brain turns market complexity into clear, actionable intelligence — for nervous beginners and experienced traders alike.
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:48}}>
          <button onClick={()=>setMode("signup")} style={{background:"linear-gradient(135deg,var(--blue),#0065cc)",border:"none",borderRadius:6,padding:"12px 28px",color:"#fff",fontSize:10,letterSpacing:1.5,fontWeight:600,boxShadow:"0 0 30px #3d9eff33"}}>GET STARTED FREE →</button>
          <button onClick={()=>setMode("login")} style={{background:"transparent",border:"1px solid var(--border2)",borderRadius:6,padding:"12px 28px",color:"var(--text2)",fontSize:10,letterSpacing:1.5}}>LOG IN</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:8,maxWidth:780,width:"100%"}}>
          {[
            {icon:"◈",title:"9 Research Bots",desc:"Geo, macro, earnings, fundamentals, news, technical, insider, analyst, hiring"},
            {icon:"◉",title:"Wave Intelligence",desc:"Spark → Confirmed → Escalation → Structural → Regime with evidence gating"},
            {icon:"◎",title:"Sebastian AI",desc:"Ask questions about any asset in plain English — or dive into full technical depth"},
            {icon:"⊕",title:"Live Prices",desc:"Real-time Yahoo Finance prices across stocks, crypto, forex, metals and more"},
          ].map(f=>(
            <div key={f.title} style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:6,padding:"14px",textAlign:"left"}}>
              <div style={{fontSize:18,color:"var(--blue)",marginBottom:6,fontFamily:"monospace"}}>{f.icon}</div>
              <div style={{fontSize:11,fontWeight:600,color:"#c8cce8",marginBottom:4}}>{f.title}</div>
              <div style={{fontSize:9,color:"var(--text2)",lineHeight:1.6}}>{f.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  const isSignup=mode==="signup";
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:16,background:"var(--bg0)"}}>
      <div style={{width:"100%",maxWidth:360,animation:"fadeUp 0.25s ease"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontFamily:"'Barlow Condensed'",fontSize:22,fontWeight:900,letterSpacing:3}}>MARKET <span style={{color:"var(--blue)"}}>BRAIN</span></div>
          <div style={{fontSize:9,color:"var(--text2)",marginTop:3}}>{isSignup?"Create your account":"Welcome back"}</div>
        </div>
        <div style={{background:"var(--bg1)",border:"1px solid var(--border2)",borderRadius:8,padding:22}}>
          {isSignup&&<div style={{marginBottom:12}}><div style={{fontSize:7,color:"var(--text3)",letterSpacing:2,marginBottom:4}}>NAME</div><input value={form.name} onChange={set("name")} placeholder="Your name" className="input-dark"/></div>}
          <div style={{marginBottom:12}}><div style={{fontSize:7,color:"var(--text3)",letterSpacing:2,marginBottom:4}}>EMAIL</div><input value={form.email} onChange={set("email")} type="email" placeholder="you@example.com" className="input-dark"/></div>
          <div style={{marginBottom:18}}><div style={{fontSize:7,color:"var(--text3)",letterSpacing:2,marginBottom:4}}>PASSWORD</div><input value={form.password} onChange={set("password")} type="password" placeholder={isSignup?"Min 6 characters":"Your password"} className="input-dark" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
          {error&&<div style={{background:"#ff4d6a18",border:"1px solid #ff4d6a44",borderRadius:4,padding:"7px 10px",fontSize:9,color:"#ff8090",marginBottom:12}}>{error}</div>}
          <button onClick={submit} disabled={loading} style={{width:"100%",background:loading?"var(--bg3)":"linear-gradient(135deg,var(--blue),#0065cc)",border:"none",borderRadius:5,padding:"10px",color:loading?"var(--text3)":"#fff",fontSize:10,letterSpacing:1,fontWeight:600}}>{loading?"...":(isSignup?"CREATE ACCOUNT":"LOG IN")}</button>
          <div style={{textAlign:"center",marginTop:12,fontSize:8,color:"var(--text2)"}}>
            {isSignup?"Have an account? ":"No account? "}
            <span onClick={()=>{setMode(isSignup?"login":"signup");setError("");}} style={{color:"var(--blue)",cursor:"pointer"}}>{isSignup?"Log in":"Sign up free"}</span>
          </div>
        </div>
        <button onClick={()=>setMode("home")} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"var(--text3)",fontSize:8}}>← Back</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  MAIN APP
// ─────────────────────────────────────────────────────────────
function MainApp({user,onLogout}){
  const[intel,setIntel]=useState({});
  const[loading,setLoading]=useState(true);
  const[liveCount,setLiveCount]=useState(0);
  const[fxRates,setFxRates]=useState(null);
  const[lastUpdated,setLastUpdated]=useState(null);
  const[selected,setSelected]=useState(null);
  const[filterSector,setFilterSector]=useState("All");
  const[filterCap,setFilterCap]=useState("All");
  const[filterWave,setFilterWave]=useState("All");
  const[filterBias,setFilterBias]=useState("All");
  const[sortMode,setSortMode]=useState("confidence");
  const[searchQ,setSearchQ]=useState("");
  const[currency,setCurrency]=useState(CURRENCIES[0]);
  const[watchlist,setWatchlist]=useState([]);
  const[showCurrModal,setShowCurrModal]=useState(false);
  const[sebastianTarget,setSebastianTarget]=useState(null);
  const[saving,setSaving]=useState(false);
  const[activeView,setActiveView]=useState("intel"); // intel | catalysts | sebastian
  const sessionKeyRef=useRef(Date.now());

  // Load portfolio
  useEffect(()=>{
    api("/api/portfolio").then(p=>{if(p.watchItems)setWatchlist(p.watchItems);}).catch(()=>{});
  },[]);

  // Auto-save
  const savePortfolio=useCallback(async(w)=>{
    setSaving(true);
    try{await api("/api/portfolio",{method:"POST",body:JSON.stringify({trades:[],watchItems:w,balance:1000,startBalance:1000})});}
    catch{}
    setSaving(false);
  },[]);
  useEffect(()=>{const t=setTimeout(()=>savePortfolio(watchlist),2500);return()=>clearTimeout(t);},[watchlist]);

  // FX
  const toLocal=useCallback((usd)=>{
    let rate;
    if(fxRates?.USD&&fxRates[currency.code]!==undefined)rate=fxRates[currency.code]/fxRates.USD;
    else rate=currency.fb/1.27;
    return parseFloat((usd*rate).toFixed(4));
  },[fxRates,currency]);
  const fmtMoney=useCallback((usd)=>{
    const v=toLocal(usd);
    return`${currency.symbol}${v>=10000?v.toFixed(0):v>=100?v.toFixed(2):v>=1?v.toFixed(2):v.toFixed(4)}`;
  },[toLocal,currency]);

  // Refresh
  const doRefresh=useCallback(async()=>{
    const key=sessionKeyRef.current;
    const fresh={};
    ASSETS.forEach(a=>{fresh[a.ticker]=generateIntelligence(a,key);});
    try{
      const[liveData,liveFx]=await Promise.all([fetchLivePrices(ASSETS.map(a=>a.ticker)),fetchFxRates()]);
      if(liveFx)setFxRates(liveFx);
      if(liveData){
        let cnt=0;
        ASSETS.forEach(a=>{
          const merged=mergeLive(fresh[a.ticker],liveData,a.ticker);
          fresh[a.ticker]=merged;
          if(merged.livePrice)cnt++;
        });
        setLiveCount(cnt);
      }
    }catch{}
    setIntel(fresh);
    setLastUpdated(new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
    setLoading(false);
  },[]);

  useEffect(()=>{doRefresh();},[]);
  useEffect(()=>{const t=setInterval(doRefresh,30000);return()=>clearInterval(t);},[]);

  // Filtered + sorted
  const filtered=useMemo(()=>
    ASSETS.filter(a=>{
      if(!intel[a.ticker])return false;
      const sig=intel[a.ticker];
      if(filterSector!=="All"&&a.sector!==filterSector)return false;
      if(filterCap!=="All"&&a.cap!==filterCap)return false;
      if(filterWave!=="All"&&sig.wave!==filterWave)return false;
      if(filterBias!=="All"&&sig.bias!==filterBias)return false;
      if(searchQ){const q=searchQ.toLowerCase();if(!a.ticker.toLowerCase().includes(q)&&!a.name.toLowerCase().includes(q)&&!a.sector.toLowerCase().includes(q))return false;}
      return true;
    }).sort((a,b)=>{
      const sa=intel[a.ticker],sb=intel[b.ticker];
      if(sortMode==="confidence")return sb.confidence-sa.confidence;
      if(sortMode==="wave")return WAVE_STATES.indexOf(sb.wave)-WAVE_STATES.indexOf(sa.wave);
      if(sortMode==="intensity")return sb.intensity-sa.intensity;
      if(sortMode==="change")return(sb.changePct||0)-(sa.changePct||0);
      if(sortMode==="change_neg")return(sa.changePct||0)-(sb.changePct||0);
      return 0;
    })
  ,[intel,filterSector,filterCap,filterWave,filterBias,sortMode,searchQ]);

  const watchedTickers=new Set(watchlist.map(w=>w.ticker));
  const escalatingCount=Object.values(intel).filter(i=>["escalation","structural","regime"].includes(i.wave)).length;

  if(loading)return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
      <div style={{width:36,height:36,border:"2px solid var(--border2)",borderTop:"2px solid var(--blue)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontSize:9,color:"var(--text3)",letterSpacing:2}}>LOADING INTELLIGENCE...</div>
    </div>
  );

  return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>

      {/* Currency modal */}
      {showCurrModal&&(
        <div className="modal-overlay" onClick={()=>setShowCurrModal(false)}>
          <div className="modal-box" style={{width:"100%",maxWidth:300,padding:8}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:8,color:"var(--text3)",letterSpacing:2,padding:"8px 8px 4px"}}>SELECT CURRENCY</div>
            {CURRENCIES.map(c=>{
              const isA=c.code===currency.code;
              return(
                <div key={c.code} onClick={()=>{setCurrency(c);setShowCurrModal(false);}} style={{display:"flex",gap:10,alignItems:"center",padding:"8px",borderRadius:4,cursor:"pointer",background:isA?"var(--bg3)":"transparent",marginBottom:2}}>
                  <span style={{fontSize:16}}>{c.flag}</span>
                  <span style={{fontSize:11,fontWeight:600,color:isA?"var(--blue)":"var(--text)",fontFamily:"monospace"}}>{c.code}</span>
                  <span style={{fontSize:9,color:"var(--text3)",flex:1}}>{c.symbol}</span>
                  {isA&&<span style={{color:"var(--blue)",fontSize:10}}>✓</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Sebastian modal */}
      {sebastianTarget&&(
        <SebastianModal
          asset={sebastianTarget.asset}
          intel={sebastianTarget.intel}
          fmtMoney={fmtMoney}
          onClose={()=>setSebastianTarget(null)}
        />
      )}

      {/* ── HEADER ── */}
      <div style={{borderBottom:"1px solid var(--border)",padding:"6px 12px",display:"flex",alignItems:"center",gap:8,flexShrink:0,flexWrap:"wrap",background:"var(--bg1)"}}>
        <div style={{fontFamily:"'Barlow Condensed'",fontSize:17,fontWeight:900,letterSpacing:2,color:"#e0e4ff"}}>
          MARKET <span style={{color:"var(--blue)"}}>BRAIN</span>
        </div>
        <div style={{height:16,width:1,background:"var(--border)",flexShrink:0}}/>
        <div style={{display:"flex",gap:5,flex:1,flexWrap:"wrap",alignItems:"center"}}>
          {/* Summary chips */}
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:4,padding:"3px 8px",display:"flex",gap:5,alignItems:"center"}}>
            <span style={{fontSize:7,color:"var(--text3)",letterSpacing:1}}>ESCALATING</span>
            <span style={{fontSize:10,color:"#f5c842",fontWeight:600,fontFamily:"monospace"}}>{escalatingCount}</span>
          </div>
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:4,padding:"3px 8px",display:"flex",gap:5,alignItems:"center"}}>
            <span style={{fontSize:7,color:"var(--text3)",letterSpacing:1}}>LIVE</span>
            <span style={{fontSize:10,color:liveCount>0?"var(--green)":"var(--text3)",fontWeight:600,fontFamily:"monospace"}}>{liveCount}</span>
          </div>
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:4,padding:"3px 8px",display:"flex",gap:5,alignItems:"center"}}>
            <span style={{fontSize:7,color:"var(--text3)",letterSpacing:1}}>WATCHED</span>
            <span style={{fontSize:10,color:"#f5c842",fontWeight:600,fontFamily:"monospace"}}>{watchlist.length}</span>
          </div>
          {saving&&<span style={{fontSize:7,color:"var(--text3)"}}>saving...</span>}
        </div>
        <div style={{display:"flex",gap:5,alignItems:"center",marginLeft:"auto"}}>
          <button onClick={()=>setShowCurrModal(true)} style={{background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:4,padding:"3px 8px",display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:12}}>{currency.flag}</span>
            <span style={{fontSize:8,color:"var(--blue)",fontWeight:600}}>{currency.code}</span>
          </button>
          <button onClick={doRefresh} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:4,padding:"3px 7px",color:"var(--text2)",fontSize:11}}>↻</button>
          <span style={{fontSize:8,color:"var(--text3)"}}>Hi, {user.name.split(" ")[0]}</span>
          <button onClick={async()=>{await api("/api/auth/logout",{method:"POST"}).catch(()=>{});localStorage.removeItem("mb_token");onLogout();}} style={{background:"transparent",border:"1px solid var(--border)",borderRadius:4,padding:"3px 7px",color:"var(--text3)",fontSize:7,letterSpacing:.5}}>OUT</button>
        </div>
      </div>

      {/* ── VIEW TABS ── */}
      <div style={{borderBottom:"1px solid var(--border)",padding:"0 12px",display:"flex",gap:0,flexShrink:0,background:"var(--bg2)"}}>
        {[
          ["intel","◈ ASSETS"],
          ["catalysts","◉ CATALYSTS"],
          ["sebastian","◎ SEBASTIAN"],
        ].map(([v,l])=>(
          <button key={v} onClick={()=>setActiveView(v)} style={{
            background:"transparent",
            border:"none",
            borderBottom:`2px solid ${activeView===v?"var(--blue)":"transparent"}`,
            padding:"8px 14px",
            color:activeView===v?"var(--blue)":"var(--text3)",
            fontSize:9,
            letterSpacing:1,
            whiteSpace:"nowrap",
            transition:"all 0.15s",
          }}>{l}</button>
        ))}
      </div>

      {/* ── FILTER BAR (only for intel view) ── */}
      {activeView==="intel"&&<div style={{borderBottom:"1px solid var(--border)",padding:"5px 12px",background:"var(--bg1)",flexShrink:0}}>
        <div style={{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center",marginBottom:4}}>
          {/* Search */}
          <input
            value={searchQ} onChange={e=>setSearchQ(e.target.value)}
            placeholder="search ticker / name..."
            className="input-dark"
            style={{width:130,padding:"3px 8px",fontSize:9}}
          />
          {/* Sector */}
          <div style={{height:16,width:1,background:"var(--border)",margin:"0 3px"}}/>
          {SECTORS.map(s=>(
            <button key={s} className={`pill${filterSector===s?" active":""}`} onClick={()=>setFilterSector(s)}>
              {s==="All"?"ALL SECTORS":s.toUpperCase()}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center"}}>
          {/* Cap */}
          {CAPS_ORDER.map(c=>(
            <button key={c} className={`pill${filterCap===c?" active":""}`} onClick={()=>setFilterCap(c)} style={filterCap===c?{borderColor:CAP_COLORS[c]||"var(--border2)",color:CAP_COLORS[c]||"var(--text)"}:{}}>
              {c==="All"?"ALL CAPS":c.toUpperCase()}
            </button>
          ))}
          <div style={{height:16,width:1,background:"var(--border)",margin:"0 3px"}}/>
          {/* Wave filter */}
          {["All",...WAVE_STATES].map(w=>(
            <button key={w} className={`pill${filterWave===w?" active":""}`} onClick={()=>setFilterWave(w)} style={filterWave===w&&w!=="All"?{borderColor:WAVE_CFG[w]?.color+"66",color:WAVE_CFG[w]?.color}:{}}>
              {w==="All"?"ALL WAVES":(WAVE_CFG[w]?.label||w.toUpperCase())}
            </button>
          ))}
          <div style={{height:16,width:1,background:"var(--border)",margin:"0 3px"}}/>
          {/* Bias */}
          {["All","bullish","neutral","bearish"].map(b=>(
            <button key={b} className={`pill${filterBias===b?" active":""}`} onClick={()=>setFilterBias(b)}>
              {b==="All"?"ALL BIAS":b.toUpperCase()}
            </button>
          ))}
          <div style={{marginLeft:"auto",display:"flex",gap:3}}>
            {[["confidence","CONF"],["wave","WAVE"],["intensity","INT"],["change","TOP ▲"],["change_neg","TOP ▼"]].map(([v,l])=>(
              <button key={v} className={`pill${sortMode===v?" active":""}`} onClick={()=>setSortMode(v)}>{l}</button>
            ))}
          </div>
        </div>
      </div>}

      {/* ── CATALYST VIEW ── */}
      {activeView==="catalysts"&&(
        <div style={{flex:1,display:"flex",overflow:"hidden",minHeight:0}}>
          <CatalystView fmtMoney={fmtMoney}/>
        </div>
      )}

      {/* ── SEBASTIAN VIEW ── */}
      {activeView==="sebastian"&&(
        <div style={{flex:1,display:"flex",overflow:"hidden",minHeight:0}}>
          <SebastianPage/>
        </div>
      )}

      {/* ── INTEL ASSET GRID ── */}
      {activeView==="intel"&&<div style={{flex:1,display:"flex",overflow:"hidden",minHeight:0}}>

        {/* Cards grid */}
        <div style={{flex:1,overflowY:"auto",padding:"8px 10px"}}>
          {/* Watchlist strip (if any) */}
          {watchlist.length>0&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:7,color:"#f5c842",letterSpacing:2,marginBottom:5}}>★ WATCHLIST ({watchlist.length})</div>
              <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4}}>
                {watchlist.map(w=>{
                  const a=ASSETS.find(x=>x.ticker===w.ticker);
                  const sig=a?intel[a.ticker]:null;
                  if(!a||!sig)return null;
                  const pch=sig.changePct||0;
                  return(
                    <div key={w.id} onClick={()=>setSelected(a)} style={{background:"var(--bg2)",border:"1px solid #f5c84222",borderRadius:5,padding:"5px 8px",cursor:"pointer",flexShrink:0,minWidth:100}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                        <span style={{fontSize:10,fontWeight:600,color:"#e0e4ff",fontFamily:"'Barlow Condensed'",letterSpacing:.3}}>{a.ticker}</span>
                        <WaveBadge wave={sig.wave}/>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between"}}>
                        <span style={{fontSize:9,color:"#c0c4e0",fontFamily:"monospace"}}>{fmtMoney(sig.price)}</span>
                        <span style={{fontSize:8,color:pCol(pch)}}>{fmtPct(pch)}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Results count */}
          <div style={{fontSize:7,color:"var(--text3)",letterSpacing:1.5,marginBottom:6}}>
            {filtered.length} ASSET{filtered.length!==1?"S":""} · {lastUpdated&&`Updated ${lastUpdated}`}
          </div>

          {/* Card grid */}
          <div style={{
            display:"grid",
            gridTemplateColumns:`repeat(auto-fill,minmax(${selected?"150px":"160px"},1fr))`,
            gap:5,
          }}>
            {filtered.map(a=>(
              <IntelCard
                key={a.ticker}
                asset={a}
                intel={intel[a.ticker]}
                selected={selected?.ticker===a.ticker}
                onSelect={()=>setSelected(prev=>prev?.ticker===a.ticker?null:a)}
                fmtMoney={fmtMoney}
                isWatching={watchedTickers.has(a.ticker)}
              />
            ))}
          </div>
        </div>

        {/* Detail panel */}
        {selected&&intel[selected.ticker]&&(
          <div style={{width:300,borderLeft:"1px solid var(--border)",flexShrink:0,overflow:"hidden",display:"flex",flexDirection:"column",background:"var(--bg1)"}}>
            {/* Panel header */}
            <div style={{padding:"7px 10px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,background:"var(--bg2)"}}>
              <span style={{fontSize:7,color:"var(--text3)",letterSpacing:2}}>INTELLIGENCE DETAIL</span>
              <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:14,lineHeight:1}}>×</button>
            </div>
            <DetailPanel
              asset={selected}
              intel={intel[selected.ticker]}
              fmtMoney={fmtMoney}
              isWatching={watchedTickers.has(selected.ticker)}
              onWatch={(asset,sig)=>{
                if(watchedTickers.has(asset.ticker)){
                  setWatchlist(p=>p.filter(w=>w.ticker!==asset.ticker));
                }else{
                  setWatchlist(p=>[...p,{id:uid(),ticker:asset.ticker,name:asset.name,sector:asset.sector,cap:asset.cap,addedAt:Date.now(),entryPrice:sig.price,wave:sig.wave,confidence:sig.confidence}]);
                }
              }}
              onAskSebastian={(asset,sig)=>setSebastianTarget({asset,intel:sig})}
            />
          </div>
        )}
      </div>}

      {/* Status bar */}
      <div style={{borderTop:"1px solid var(--border)",padding:"3px 12px",display:"flex",gap:10,alignItems:"center",flexShrink:0,background:"var(--bg1)"}}>
        <span style={{fontSize:7,color:liveCount>0?"var(--green)":"var(--text3)",animation:liveCount>0?"pulse 2s infinite":"none"}}>
          {liveCount>0?"● LIVE":"● SIM"}
        </span>
        <span style={{fontSize:7,color:"var(--text3)"}}>{liveCount} live prices · {ASSETS.length} assets tracked</span>
        <span style={{fontSize:7,color:"var(--text3)",marginLeft:"auto"}}>Market Brain v7 · Not financial advice</span>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  ROOT
// ─────────────────────────────────────────────────────────────
function Root(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);

  useEffect(()=>{
    const token=localStorage.getItem("mb_token");
    if(!token){setChecking(false);return;}
    api("/api/auth/me").then(u=>{setUser(u);setChecking(false);}).catch(()=>{localStorage.removeItem("mb_token");setChecking(false);});
  },[]);

  if(checking)return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{width:28,height:28,border:"2px solid #111128",borderTop:"2px solid var(--blue)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
    </div>
  );
  if(!user)return<AuthPage onAuth={u=>setUser(u)}/>;
  return<MainApp user={user} onLogout={()=>setUser(null)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
